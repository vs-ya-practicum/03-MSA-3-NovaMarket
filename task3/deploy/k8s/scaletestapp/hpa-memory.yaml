apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:
  name: scaletestapp-memory
  namespace: scaletestapp

spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 0
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scaletestapp
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
