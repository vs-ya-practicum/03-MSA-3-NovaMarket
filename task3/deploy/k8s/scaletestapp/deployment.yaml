apiVersion: apps/v1

kind: Deployment

metadata:
  name: scaletestapp
  namespace: scaletestapp

spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      containers:
        - name: scaletestapp
          image: ghcr.io/yandex-practicum/scaletestapp:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 20Mi
            limits:
              cpu: 500m
              memory: 30Mi
