events {
}

http {
    upstream backend {
        server localhost:8081;
    }

    limit_req_zone $binary_remote_addr zone=web:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=mobile:10m rate=30r/s;

    server {
        listen 80;

        error_page 418 = @web_api;
        error_page 419 = @mobile_api;

        location /api/ {
            if ($http_client_type = "web") {
                return 418;
            }

            if ($http_client_type = "mobile") {
                return 419;
            }

            proxy_pass http://backend;
        }

        location @web_api {
            limit_req zone=web burst=200 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }

        location @mobile_api {
            limit_req zone=mobile burst=200 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
        }
    }

    server {
        listen 8081;

        location /api/ {
            add_header Content-Type application/json;

            if ($http_client_type = "web") {
                return 200 "{\"status\": \"success\", \"service\": \"web_backend\"}";
            }

            if ($http_client_type = "mobile") {
                return 200 "{\"status\": \"success\", \"service\": \"mobile_backend\"}";
            }

            return 200 "{\"status\": \"success\", \"service\": \"default_backend\"}";
        }
    }
}
