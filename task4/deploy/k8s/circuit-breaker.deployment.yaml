apiVersion: apps/v1
kind: Deployment
metadata:
  name: circuit-breaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: circuit-breaker
  template:
    metadata:
      labels:
        app: circuit-breaker
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: circuit-breaker-config
